[package]
name = "webchat-assistant"
version = "1.0.0"
description = "WebChat-Assistant Native Desktop Studio Companion"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[package]
name = "chat-codex-studio"
version = "2.5.0"
description = "Chat-Codex Studio Native Desktop Client"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
